
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>產品管理系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; margin:0; background:#fafafa; }
    header { position: sticky; top:0; background:#fff; padding:12px; border-bottom:1px solid #eee; }
    .wrap { padding:12px; }
    input, select, button, textarea { font-size:16px; padding:10px; width:100%; box-sizing:border-box; margin:6px 0; }
    .tabs { display:flex; gap:24px; align-items:center; }
    .tab { flex:1; padding:12px; border:1px solid #e5e5e5; border-radius:999px; background:#fff; }
    .tab.active { background:#111; color:#fff; }
    .card { border:1px solid #eee; border-radius:12px; padding:12px; margin:10px 0; box-shadow:0 2px 6px rgba(0,0,0,0.05); background:#fff; }
    .muted { color:#666; font-size:13px; }
    .hide { display:none; }
    label { font-size:13px; color:#444; }
    .subtabs { display:flex; gap:8px; margin:8px 0; }
    .subtab { padding:8px 12px; border:1px solid #ddd; border-radius:999px; background:#fafafa; }
    .subtab.active { background:#111; color:#fff; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#111; color:#fff; margin-left:8px; }
    .price-mask { display:inline-block; background:#000; color:transparent; border-radius:4px; padding:0 6px; user-select:none; }
    .price-mask.revealed { background:transparent; color:inherit; }
    .clickable { cursor:pointer; }
    .row { display:flex; gap:8px; }
    .row > button { flex:1; }
    .photo-gallery {display: flex; gap: 8px; overflow-x: auto; padding: 6px 0;}
    .photo-gallery img {max-width: 100%; height: auto; max-height: 50vh;  /* 手機上避免太高 */ object-fit: contain; border-radius: 12px; flex-shrink: 0;    /* 讓橫向滾動生效 */}
    .photo-preview-row img {height: 100px; width: auto; object-fit:cover; border-radius: 8px; flex-shrink: 0; max-width: none !important; max-height: none !important;}
    @media (max-width: 600px) {.photo-gallery img {max-height: 40vh;}}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;">
      <div style="font-weight:700;">產品管理系統 <span id="ver" class="badge">V1.1.0</span></div>
      <div id="status" class="muted"></div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-products" onclick="switchTab('products')">產品資料</button>
      <button class="tab" id="tab-vendors" onclick="switchTab('vendors')">廠商資料</button>
      <button class="tab" id="tab-create" onclick="switchTab('create')">內容</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="view-products">
    <div class="card">
      <input id="q" placeholder="搜尋產品名稱" />
      <button id="btn-search">搜尋</button>
    </div>
    <div id="product-list"></div>
  </section>

  <section id="view-vendors" class="hide">
    <div class="card">
      <input id="vq" placeholder="搜尋廠商名稱" />
      <button id="btn-vsearch">搜尋</button>
    </div>
    <div id="vendor-list"></div>
  </section>

  <section id="view-create" class="hide">
    <div class="subtabs">
      <button class="subtab active" id="subtab-newproduct">新增產品</button>
      <button class="subtab" id="subtab-newvendor">新增廠商</button>
    </div>

    <div id="sub-newproduct">
      <!-- 隱藏的檔案 input：相機 / 相簿，可選多張 -->
      <input id="np-photo-camera" class="hide" type="file" accept="image/*" capture="environment" />
      <input id="np-photo-gallery" class="hide" type="file" accept="image/*" multiple />
      <div class="row">
        <button id="btn-photo-camera" type="button">📷 拍照</button>
        <button id="btn-photo-gallery" type="button">🖼 相簿（可多選）</button>
      </div>
      <div id="np-photo-name" class="muted"></div>
      <div id="np-photo-preview" class="photo-preview-row"></div>

      <label>產品名稱</label><input id="np-name" />
      <label>產品編號</label><input id="np-productno" />
      <label>廠商名稱</label><select id="np-vendor"><option value="">（可留空）</option></select>
      <label>材質</label><input id="np-material" />
      <label>料號</label><input id="np-sku" />
      <label>顏色或色粉</label><input id="np-color" />
      <label>成品重量(g)</label><input id="np-dye" />
      <label>包裝方式</label><input id="np-packaging" />
      <label>產品單價</label><input id="np-price" type="number" step="0.01" />

      <label>其他</label>
      <textarea id="np-other">外徑：&#10;內徑：&#10;厚度：&#10;溝寬：</textarea>

      <button id="btn-create-product">新增</button>
      <div id="np-status" class="muted"></div>
    </div>

    <div id="sub-newvendor" class="hide">
      <label>廠商名稱</label><input id="nv-name" />
      <label>聯絡地址</label><input id="nv-addr" />
      <label>聯絡電話</label><input id="nv-phone" />
      <label>聯絡人</label><input id="nv-contact" />
      <label>傳真號碼</label><input id="nv-fax" />
      <label>電子郵件</label><input id="nv-email" />
      <label>其他</label><textarea id="nv-other"></textarea>
      <button id="btn-create-vendor">新增廠商</button>
      <div class="card" style="margin-top:10px">
        <div class="muted">或匯入 Excel</div>
        <input type="file" id="ve-file" accept=".xlsx,.xls" />
        <button id="btn-import-vendor-excel">匯入 Excel</button>
        <div id="ve-status" class="muted"></div>
      </div>
    </div>
  </section>

  <section id="view-vendor-detail" class="hide">
    <div id="vendor-detail"></div>
  </section>

  <section id="view-product-detail" class="hide">
    <div class="card"><button id="btn-back-products">← 返回產品選單</button></div>
    <div id="product-detail"></div>
  </section>

  <section id="view-vendor-detail" class="hide">
    <div class="card"><button id="btn-back-vendors">← 返回廠商資料</button></div>
    <div id="vendor-detail"></div>
  </section>
</div>

<script>
let token=''; const API = location.origin;

// 「其他」欄位的預設模板
const DEFAULT_OTHER_TEXT = "外徑：\n內徑：\n厚度：\n溝寬：";

// 多張照片暫存（新增產品）
let selectedPhotoFiles = [];

// 產品詳情編輯用的照片暫存
let pdEditPhotoPaths = [];
let pdNewPhotoFiles = [];

let _productsReqSeq = 0;

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function $(id){return document.getElementById(id)}
function switchTab(name){
  ['products','vendors','create','product-detail','vendor-detail'].forEach(t=>{
    const s=$('view-'+t), b=$('tab-'+t);
    if(s){ s.classList.toggle('hide', t!==name); }
    if(b){ b.classList.toggle('active', t===name); }
  });
  if(name==='products'){ searchProducts(); }
  if(name==='vendors'){ loadVendors(); }
  if(name==='create'){ preloadVendors(); }
}
function switchSub(name){
  ['newproduct','newvendor'].forEach(s=>{
    const el=$('sub-'+s), tb=$('subtab-'+s);
    if(el) el.classList.toggle('hide', s!==name);
    if(tb) tb.classList.toggle('active', s===name);
  });
}
document.getElementById('subtab-newproduct').onclick=()=>switchSub('newproduct');
document.getElementById('subtab-newvendor').onclick=()=>switchSub('newvendor');

document.getElementById('btn-search').onclick=searchProducts;
document.getElementById('btn-vsearch').onclick=loadVendors;
document.getElementById('btn-create-product').onclick=createProduct;
document.getElementById('btn-create-vendor').onclick=createVendor;
document.getElementById('btn-import-vendor-excel').onclick=importVendorsExcel;

document.getElementById('btn-photo-camera').onclick=()=>{$('np-photo-camera').click();};
document.getElementById('btn-photo-gallery').onclick=()=>{$('np-photo-gallery').click();};
$('np-photo-camera').onchange=()=>{ handlePhotoChange($('np-photo-camera')); };
$('np-photo-gallery').onchange=()=>{ handlePhotoChange($('np-photo-gallery')); };

window.updateListItemFromProduce = function(id, payload){
  const qty  = (payload?.produced_last_qty ?? payload?.qty ?? 0);
  const date = (payload?.produced_at || new Date().toISOString().slice(0,10));

  const elQty  = document.querySelector(`#plq-${CSS.escape(String(id))}`);
  const elDate = document.querySelector(`#pdat-${CSS.escape(String(id))}`);

  if (elQty)  elQty.textContent  = qty;
  if (elDate) elDate.textContent = date;
};


function renderPhotoPreview(){
  const textEl = $('np-photo-name');
  const wrap = $('np-photo-preview');
  if (!textEl || !wrap) return;

  wrap.innerHTML = '';
  if (!selectedPhotoFiles.length){
    textEl.textContent = '尚未選擇照片';
    return;
  }

  textEl.textContent = `已選擇 ${selectedPhotoFiles.length} 張照片`;

  selectedPhotoFiles.forEach(file => {
    const img = document.createElement('img');
    img.alt = file.name;
    img.title = file.name;
    img.src = URL.createObjectURL(file);
    wrap.appendChild(img);
  });
}

function handlePhotoChange(input){
  if(!input.files || !input.files.length) return;
  const files = Array.from(input.files);

  // 相機每拍一次就多一張；相簿一次可選多張
  selectedPhotoFiles = selectedPhotoFiles.concat(files);

  // 讓同一個 input 可以再選檔
  input.value = '';

  renderPhotoPreview();
}

function updateListItemFromProduce(id, payload){
  const qty  = (payload?.produced_last_qty ?? payload?.qty ?? 0);
  const date = (payload?.produced_at || new Date().toISOString().slice(0,10));

  // 用 CSS.escape 保險（雖然你的 id 是數字，但這樣更穩）
  const elQty  = document.querySelector(`#plq-${CSS.escape(String(id))}`);
  const elDate = document.querySelector(`#pdat-${CSS.escape(String(id))}`);

  if (elQty)  elQty.textContent  = qty;
  if (elDate) elDate.textContent = date;
}

/* ===== 廠商地區解析 + 排序工具（請放在 <script> 最上面） ===== */

let vendorListLoadVersion = 0; // 防止舊請求覆蓋新結果

// 統一「臺」→「台」
function normalizeCity(s){ return (s || "").replace(/臺/g, "台"); }

// 地址 → 城市 → 區域
const REGION_MAP_TW = {
  北部: ["台北市","新北市","基隆市","桃園市","新竹市","新竹縣","宜蘭縣"],
  中部: ["苗栗縣","台中市","彰化縣","彰化市","南投縣","雲林縣"],
  南部: ["嘉義市","嘉義縣","台南市","高雄市","屏東縣"],
  東部: ["花蓮縣","台東縣"],
  離島: ["澎湖縣","金門縣","連江縣"]
};

function findCityTW(addr=""){
  addr = (addr || "").replace(/\s+/g,"");
  for(const [region, cities] of Object.entries(REGION_MAP_TW)){
    for(const c of cities){
      if(addr.includes(c)) return { city: c, region };
    }
  }
  return { city: "", region: "其他" };
}
function findCityTW(addr = "") {
  // 去空白 + 把「臺」統一成「台」
  let naddr = (addr || "").replace(/\s+/g, "").replace(/臺/g, "台");

  for (const [region, cities] of Object.entries(REGION_MAP_TW)) {
    for (const c of cities) {
      const cNorm = c.replace(/臺/g, "台");
      if (naddr.includes(cNorm)) {
        return { city: cNorm, region };
      }
    }
  }
  return { city: "", region: "其他" };
}

// 區域內自訂城市順序（可自行調整）
const CITY_ORDER_TW = {
  北部: ["台北市","新北市","基隆市","桃園市","新竹市","新竹縣","宜蘭縣"],
  中部: ["台中市","彰化縣","彰化市","南投縣","雲林縣","苗栗縣"], // ← 依你需求調整
  南部: ["嘉義市","嘉義縣","台南市","高雄市","屏東縣"],  // ← 高雄在台南之後
  東部: ["花蓮縣","台東縣"],
  離島: ["澎湖縣","金門縣","連江縣"]
};
function cityOrderRank(region, city){
  const arr = CITY_ORDER_TW[region] || [];
  const idx = arr.indexOf(normalizeCity(city));
  return idx === -1 ? 999 : idx;
}

function regionRankTW(r){
  return {北部:0,中部:1,南部:2,東部:3,離島:4}[r] ?? 5;
}

// 依「區域→城市自訂順序→名稱」排序
function sortVendorsTW(items){
  const withRegion = items.map(v=>{
    const {city, region} = findCityTW(v.address || "");
    return {...v, _city: city, _region: region, _rank: regionRankTW(region)};
  });

  // 方便你在 console 驗證
  console.log("📍 Vendor region parse result:",
    withRegion.map(v=>({name:v.name, addr:v.address, city:v._city, region:v._region, rank:v._rank}))
  );

  withRegion.sort((a,b)=>{
    if(a._rank !== b._rank) return a._rank - b._rank;                          // 區域順序
    const ar = cityOrderRank(a._region, a._city), br = cityOrderRank(b._region, b._city);
    if(ar !== br) return ar - br;                                              // 區域內城市順序
    return (a.name||"").localeCompare(b.name||"", "zh-Hant");                   // 同城市再比名稱
  });

  return withRegion;
}

// 將排序結果寫入指定 <select>
function applyVendorOptions(selectId, itemsSorted){
  const sel = document.getElementById(selectId);
  if(!sel) return;
  const frag = document.createDocumentFragment();
  const first = document.createElement('option');
  first.value = "";
  first.textContent = "（未選擇）";
  frag.appendChild(first);
  for(const v of itemsSorted){
    const opt = document.createElement('option');
    opt.value = String(v.id);
    opt.textContent = v._city ? `${v.name}（${v._city}）` : v.name;
    frag.appendChild(opt);
  }
  sel.innerHTML = "";
  sel.appendChild(frag);
  sel.value = ""; // 預設空白
}

// 載入廠商→排序→寫入下拉；版本號避免舊請求覆蓋
async function preloadVendors(selectId='np-vendor'){
  if(!token) return;
  const myVersion = ++vendorListLoadVersion;
  const res = await fetch(API+'/vendors', {headers:{'Authorization':'Bearer '+token}});
  let items = await res.json();
  items = sortVendorsTW(items);
  if(myVersion !== vendorListLoadVersion) return; // 忽略過期結果
  applyVendorOptions(selectId, items);
}


document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='btn-back-products'){
    document.getElementById('view-product-detail').classList.add('hide');
    switchTab('products');
  }
  if(e.target && e.target.id==='btn-back-vendors'){
    document.getElementById('view-vendor-detail').classList.add('hide');
    switchTab('vendors');
  }
}, {passive:true});

async function loginIfNeeded(){
  if(token) return;
  const fd=new URLSearchParams(); fd.append('username','admin'); fd.append('password','admin123');
  const r=await fetch(API+'/auth/login',{method:'POST', body: fd});
  if(r.ok){
    token=(await r.json()).access_token;
    document.getElementById('status').textContent='已登入';
  }else{
    document.getElementById('status').textContent='未登入';
  }
  try{
    const v=await fetch(API+'/__version'); if(v.ok){ const j=await v.json(); if(j.build) document.getElementById('ver').textContent=j.build; }
  }catch(_){}
}

function maskPrice(value){
  if(value===null || value===undefined || value==='') return '-';
  return `<span class="price-mask" onclick="this.classList.add('revealed'); this.textContent='${String(value)}'">████</span>`;
}

async function searchProducts(){
  await loginIfNeeded();
  if(!token){ alert('請先登入'); return; }

  const url = new URL(API + '/products');
  const qEl = document.getElementById('q');
  const q = qEl ? qEl.value.trim() : '';
  if (q) url.searchParams.set('q', q);
  url.searchParams.set('_', Date.now());

  const mySeq = ++_productsReqSeq;
  const res = await fetch(url, {
    headers: { 'Authorization': 'Bearer ' + token },
    cache: 'no-store'
  });
  if (mySeq !== _productsReqSeq) return;

  if (!res.ok){
    document.getElementById('product-list').innerHTML =
      `<div class="muted">讀取失敗（${res.status}）</div>`;
    return;
  }

  const items = await res.json();
  document.getElementById('product-list').innerHTML = items.map(p=>`
    <div class="card clickable" onclick="openProduct(${p.id})" role="button" tabindex="0">
    <div><b>${p.name||'-'}</b></div>
    <div class="muted">${p.material||''} ${p.color||''}</div>
    <div class="muted">最後生產數量：<span id="plq-${p.id}">${p.produced_last_qty ?? 0}</div>
    <div class="muted">最後生產日期：<span id="pdat-${p.id}">${p.produced_at || '-'}</div>
  </div>
`).join('');

}

async function loadVendors(){
  await loginIfNeeded();

  const url = new URL(API + '/vendors');
  const qEl = document.getElementById('vq');
  if (qEl && qEl.value.trim()) url.searchParams.set('q', qEl.value.trim());

  const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
  let items = await res.json();

  // ✅ 地區排序（依你頁面上已定義的：findCityTW / regionRankTW / CITY_ORDER_TW / cityOrderRank / sortVendorsTW）
  items = sortVendorsTW(items);

  const list = document.getElementById('vendor-list');
  list.innerHTML = items.map(v => `
    <div class="card vendor-card" data-id="${v.id}">
      <div><b>廠商名稱：</b>${v.name}${v._city ? `（${v._city}）` : ''}</div>
      <div><b>地址：</b>${v.address || '-'}</div>
      <div><b>電話：</b>${v.phone || '-'}</div>
    </div>
  `).join('');

  // 讓整張卡片可點：進入詳細頁
  list.querySelectorAll('.vendor-card').forEach(card=>{
    card.addEventListener('click', () => openVendor(card.getAttribute('data-id')));
  });
}


async function saveProductPhotos(pid){
  const keepPaths = Array.isArray(pdEditPhotoPaths) ? pdEditPhotoPaths : [];
  const newFiles  = Array.isArray(pdNewPhotoFiles) ? pdNewPhotoFiles : [];

  if (!keepPaths.length && !newFiles.length){
    return;
  }

  const fd = new FormData();
  if (keepPaths.length){
    fd.append('keep_paths', JSON.stringify(keepPaths));
  }
  newFiles.forEach(f => fd.append('photos', f));

  const res = await fetch(`${API}/products/${pid}/photos`, {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + token },
    body: fd
  });

  const txt = await res.text().catch(()=> '');
  let data = {};
  try { data = txt ? JSON.parse(txt) : {}; } catch(e){}

  if (!res.ok){
    console.error('update photos failed', res.status, txt);
    const el = document.getElementById('pe-status');
    if (el) el.textContent = '文字已儲存，但照片更新失敗：' + (data.detail || res.status);
    return;
  }

  pdNewPhotoFiles = [];
}

function renderEditPhotoList(){
  const wrap = document.getElementById('pd-edit-photo-list');
  if (!wrap) return;

  wrap.innerHTML = '';

  const paths = Array.isArray(pdEditPhotoPaths) ? pdEditPhotoPaths : [];
  const files = Array.isArray(pdNewPhotoFiles) ? pdNewPhotoFiles : [];

  paths.forEach((path, idx) => {
    const box = document.createElement('div');
    box.style.position = 'relative';
    const img = document.createElement('img');
    img.src = API + '/uploads/' + path;
    img.style.maxHeight = '220px';
    img.style.borderRadius = '12px';
    img.style.objectFit = 'contain';
    box.appendChild(img);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '刪除';
    btn.style.position = 'absolute';
    btn.style.right = '4px';
    btn.style.top = '4px';
    btn.style.padding = '2px 6px';
    btn.onclick = () => {
      pdEditPhotoPaths.splice(idx, 1);
      renderEditPhotoList();
    };
    box.appendChild(btn);

    wrap.appendChild(box);
  });

  files.forEach((file, idx) => {
    const box = document.createElement('div');
    box.style.position = 'relative';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.style.maxHeight = '220px';
    img.style.borderRadius = '12px';
    img.style.objectFit = 'contain';
    box.appendChild(img);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '移除';
    btn.style.position = 'absolute';
    btn.style.right = '4px';
    btn.style.top = '4px';
    btn.style.padding = '2px 6px';
    btn.onclick = () => {
      pdNewPhotoFiles.splice(idx, 1);
      renderEditPhotoList();
    };
    box.appendChild(btn);

    wrap.appendChild(box);
  });
}

async function openProduct(id){
  await loginIfNeeded();

  const res = await fetch(API + '/products/' + id, { headers: { 'Authorization': 'Bearer ' + token } });
  let body = '';
  try { body = await res.text(); } catch {}
  if (!res.ok) {
    console.error('GET /products/' + id, res.status, body);
    alert('讀取產品詳情失敗：' + res.status + '\n' + body);
    if (res.status === 401) alert('登入逾時，請重新登入');
    return;
  }
  const p = body ? JSON.parse(body) : {};

  const unitPriceMasked = maskPrice(p.unit_price);
  const producedAt = p.produced_at ? String(p.produced_at).slice(0,10) : '-';

  const allPhotoUrls = Array.isArray(p.photo_urls) && p.photo_urls.length

function $(id){ return document.getElementById(id) || null; }

// 物件→訊息
function toMsg(d){
  if (Array.isArray(d)) return d.map(x => ((x.loc||[]).join('.')+': '+(x.msg||x.detail||'錯誤'))).join('；');
  if (d && typeof d === 'object') return d.detail || JSON.stringify(d);
  return String(d ?? '');
}

// 安全 append：元件存在才 append；檔案 input 只在有檔案才 append
function appendIf(fd, id, field){
  const el = $(id);
  if (!el) return;
  if (el.type === 'file') { if (el.files && el.files[0]) fd.append(field, el.files[0]); }
  else { if (el.value !== '') fd.append(field, el.value); }
}

// 安全清空：元件存在才清
function clearIf(id){
  const el = $(id);
  if (!el) return;

  if (el.type === 'file') {
    el.value = '';
  } else if (el.tagName === 'SELECT') {
    el.value = '';
  } else {
    if (id === 'np-other') {
      el.value = DEFAULT_OTHER_TEXT;
    } else {
      el.value = '';
    }
  }

  if (id === 'np-photo-camera' || id === 'np-photo-gallery'){
    selectedPhotoFiles = [];
    const wrap = $('np-photo-preview');
    const textEl = $('np-photo-name');
    if (wrap) wrap.innerHTML = '';
    if (textEl) textEl.textContent = '';
  }
}

async function createProduct(){
  await loginIfNeeded();

  const name = $('np-name')?.value.trim() || '';
  const productNo = $('np-productno')?.value.trim() || '';
  const vendorId = $('np-vendor')?.value || '';

  if (!name){
    $('np-status').textContent = '請填「產品名稱」。';
    return;
  }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('product_no', productNo);
  fd.append('vendor_id', vendorId);

  appendIf(fd, 'np-material',  'material');
  appendIf(fd, 'np-sku',       'sku');
  appendIf(fd, 'np-color',     'color');
  appendIf(fd, 'np-dye',       'dye_amount');
  appendIf(fd, 'np-packaging', 'packaging');
  appendIf(fd, 'np-price',     'unit_price');

  const otherEl = $('np-other');
  if (otherEl){
    const raw = otherEl.value || '';
    const norm = raw.trim();
    if (norm && norm !== DEFAULT_OTHER_TEXT.trim()){
      fd.append('other', raw);
    }
  }

  let files = [];
  if (selectedPhotoFiles && selectedPhotoFiles.length){
    files = selectedPhotoFiles;
  } else {
    const camFiles = $('np-photo-camera')?.files ? Array.from($('np-photo-camera').files) : [];
    const galFiles = $('np-photo-gallery')?.files ? Array.from($('np-photo-gallery').files) : [];
    files = camFiles.concat(galFiles);
  }
  files.forEach(f => fd.append('photos', f));

  let respText = '';
  try{
    const res = await fetch(API + '/products', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: fd
    });
    respText = await res.text();
    let data; try{ data = JSON.parse(respText); } catch{ data = { detail: respText }; }

    if (!res.ok){
      $('np-status').textContent = '新增失敗：' + toMsg(data.detail ?? data);
      return;
    }

    $('np-status').textContent = '新增成功！條碼：' + (data.mold_barcode || '-');

    [
      'np-name','np-productno','np-vendor','np-material','np-sku','np-color','np-dye',
      'np-packaging','np-price','np-other','np-photo-camera','np-photo-gallery','np-photo-name'
    ].forEach(clearIf);

    selectedPhotoFiles = [];
    const preview = $('np-photo-preview');
    if (preview) preview.innerHTML = '';

    try { await searchProducts(); } catch(e){}
  }catch(err){
    $('np-status').textContent =
      '新增失敗（網路/程式）：' + (err?.message || '') + (respText ? '｜'+respText : '');
  }
}

async function createVendor(){
  await loginIfNeeded();

  const name = $('nv-name')?.value.trim() || '';
  if(!name){ setTextIf('nv-status','請填「廠商名稱」。'); return; }

  const payload = {
    name,
    address: $('nv-addr')?.value || '',
    phone: $('nv-phone')?.value || '',
    contact_person: $('nv-contact')?.value || '',
    fax: $('nv-fax')?.value || '',
    email: $('nv-email')?.value || '',
    other: $('nv-other')?.value || ''
  };

  let body = '';
  try{
    const res = await fetch(API+'/vendors', {
      method: 'POST',
      headers: { 'Authorization':'Bearer '+token, 'Content-Type':'application/json' },
      body: JSON.stringify(payload)
    });
    body = await res.text();
    let data; try{ data = JSON.parse(body); } catch { data = { detail: body }; }

    if(!res.ok){
      setTextIf('nv-status', '新增失敗：' + (data.detail || res.status));
      return;
    }

    setTextIf('nv-status', '新增成功：' + (data.name || name));

    // 清空欄位（不存在就略過，不會丟錯）
    ['nv-name','nv-addr','nv-phone','nv-contact','nv-fax','nv-email','nv-other']
      .forEach(id => { const el=$(id); if(el) el.value=''; });

    // 重新載入：下拉選單與列表（如果你有 sortVendorsTW 會沿用）
    try { await preloadVendors(); } catch(e){}
    try { await loadVendors(); } catch(e){}

  }catch(err){
    setTextIf('nv-status','新增失敗（網路/程式）：' + (err?.message || '') + (body? '｜'+body : ''));
  }
}
