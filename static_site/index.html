
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>產品管理系統</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; margin:0; background:#fafafa; }
    header { position: sticky; top:0; background:#fff; padding:12px; border-bottom:1px solid #eee; }
    .wrap { padding:12px; }
    input, select, button, textarea { font-size:16px; padding:10px; width:100%; box-sizing:border-box; margin:6px 0; }
    .tabs { display:flex; gap:24px; align-items:center; }
    .tab { flex:1; padding:12px; border:1px solid #e5e5e5; border-radius:999px; background:#fff; }
    .tab.active { background:#111; color:#fff; }
    .card { border:1px solid #eee; border-radius:12px; padding:12px; margin:10px 0; box-shadow:0 2px 6px rgba(0,0,0,0.05); background:#fff; }
    .muted { color:#666; font-size:13px; }
    .hide { display:none; }
    label { font-size:13px; color:#444; }
    .subtabs { display:flex; gap:8px; margin:8px 0; }
    .subtab { padding:8px 12px; border:1px solid #ddd; border-radius:999px; background:#fafafa; }
    .subtab.active { background:#111; color:#fff; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#111; color:#fff; margin-left:8px; }
    .price-mask { display:inline-block; background:#000; color:transparent; border-radius:4px; padding:0 6px; user-select:none; }
    .price-mask.revealed { background:transparent; color:inherit; }
    .clickable { cursor:pointer; }
    .row { display:flex; gap:8px; }
    .row > button { flex:1; }
    .photo-thumb {width: 72px;  height: 72px; object-fit: cover; border-radius: 8px; margin: 4px; }
    .photo-thumb-wrap {display: inline-block; position: relative; }
    .photo-thumb-wrap button {position: absolute; top: 0; right: 0; border: none; background: rgba(0,0,0,0.6); color: #fff; border-radius: 999px; padding: 0 4px; font-size: 12px; }
    .pg-btn {padding: 6px 10px; font-size: 14px; background: #f4f4f4; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
    .pg-btn:disabled {opacity: .5; cursor: default; }
    .pg-btn.active {background: #333; color: white; border-color: #333; }
    .pagination-bar {display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
    .pagination-bar .pg-btn {width: auto !important; flex: 0 0 auto; display: inline-flex; justify-content: center; align-items: center; padding: 6px 10px; font-size: 14px; background: #f4f4f4; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; }
    .pagination-bar .pg-btn:disabled {opacity: .5; cursor: default;}
    .pagination-bar .pg-btn.active {background: #333; color: white; border-color: #333; }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;">
      <div style="font-weight:700;">產品管理系統 <span id="ver" class="badge">V1.1.0</span></div>
      <div id="status" class="muted"></div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-products" onclick="switchTab('products')">產品資料</button>
      <button class="tab" id="tab-vendors" onclick="switchTab('vendors')">廠商資料</button>
      <button class="tab" id="tab-create" onclick="switchTab('create')">內容</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="view-products">
    <div class="card">
      <input id="q" placeholder="搜尋產品名稱" />
      <button id="btn-search">搜尋</button>
    </div>
    <div id="product-list"></div>
  </section>

  <section id="view-vendors" class="hide">
    <div class="card">
      <input id="vq" placeholder="搜尋廠商名稱" />
      <button id="btn-vsearch">搜尋</button>
    </div>
    <div id="vendor-list"></div>
  </section>

  <section id="view-create" class="hide">
    <div class="subtabs">
      <button class="subtab active" id="subtab-newproduct">新增產品</button>
      <button class="subtab" id="subtab-newvendor">新增廠商</button>
    </div>

    <div id="sub-newproduct">
      <input id="np-photo-camera" class="hide" type="file" accept="image/*" capture="environment" />
      <input id="np-photo-gallery" class="hide" type="file" accept="image/*" />
      <div class="row">
        <button id="btn-photo-camera" type="button">📷 拍照</button>
        <button id="btn-photo-gallery" type="button">🖼 相簿</button>
      </div>
      <div id="np-photo-name" class="muted"></div>
      <div id="np-photo-preview" class="muted"></div>
      <label>產品名稱</label><input id="np-name" />
      <label>廠商名稱</label><select id="np-vendor"><option value=""></option></select>
      <label>材質</label><select id="np-material"></select>
      <label>料號</label><input id="np-sku" />
      <label>顏色或色粉</label><input id="np-color" />
      <label>成品重量(g)</label><input id="np-dye" />
      <label>包裝方式</label><input id="np-packaging" />
      <label>產品單價</label><input id="np-price" type="number" step="0.01" />
      <label>其他</label><textarea id="np-other"></textarea>
      <button id="btn-create-product">新增</button>
      <div id="np-status" class="muted"></div>
    </div>

    <div id="sub-newvendor" class="hide">
      <label>廠商名稱</label><input id="nv-name" />
      <label>聯絡地址</label><input id="nv-addr" />
      <label>聯絡電話</label><input id="nv-phone" />
      <label>聯絡人</label><input id="nv-contact" />
      <label>傳真號碼</label><input id="nv-fax" />
      <label>電子郵件</label><input id="nv-email" />
      <label>其他</label><textarea id="nv-other"></textarea>
      <button id="btn-create-vendor">新增廠商</button>
      <div class="card" style="margin-top:10px">
        <div class="muted">或匯入 Excel（必含「廠商名稱」欄）</div>
        <input type="file" id="ve-file" accept=".xlsx,.xls" />
        <button id="btn-import-vendor-excel">匯入 Excel</button>
        <div id="ve-status" class="muted"></div>
      </div>
    </div>
  </section>

  <section id="view-vendor-detail" class="hide">
    <div id="vendor-detail"></div>
  </section>

  <section id="view-product-detail" class="hide">
    <div class="card"><button id="btn-back-products">← 返回產品選單</button></div>
    <div id="product-detail"></div>
  </section>

  <section id="view-vendor-detail" class="hide">
    <div class="card"><button id="btn-back-vendors">← 返回廠商資料</button></div>
    <div id="vendor-detail"></div>
  </section>
</div>

<script>
let token=''; const API = location.origin;
let selectedPhotos = [];
let _productsReqSeq = 0;
let productPage = 1;            // 目前頁碼
const PRODUCT_PAGE_SIZE = 15;   // 每頁幾筆（對應後端 size）
let productTotalPages = 1;      // 總頁數
let productTotalItems = 0;      // 總筆數

const OTHER_TEMPLATE = "外徑：\n內徑：\n厚度：\n溝寬：";

function $(id){return document.getElementById(id)}
function switchTab(name){
  ['products','vendors','create','product-detail','vendor-detail'].forEach(t=>{
    const s=$('view-'+t), b=$('tab-'+t);
    if(s){ s.classList.toggle('hide', t!==name); }
    if(b){ b.classList.toggle('active', t===name); }
  });
  if(name==='products'){ productPage = 1; searchProducts(1); }
  if(name==='vendors'){ loadVendors(); }
  if(name==='create'){ preloadVendors(); }
}
function switchSub(name){
  ['newproduct','newvendor'].forEach(s=>{
    const el=$('sub-'+s), tb=$('subtab-'+s);
    if(el) el.classList.toggle('hide', s!==name);
    if(tb) tb.classList.toggle('active', s===name);
  });
}
document.getElementById('subtab-newproduct').onclick=()=>switchSub('newproduct');
document.getElementById('subtab-newvendor').onclick=()=>switchSub('newvendor');

document.getElementById('btn-search').onclick=()=>{productPage = 1; searchProducts(1);};
document.getElementById('btn-vsearch').onclick=loadVendors;
document.getElementById('btn-create-product').onclick=createProduct;
document.getElementById('btn-create-vendor').onclick=createVendor;
document.getElementById('btn-import-vendor-excel').onclick=importVendorsExcel;

document.getElementById('btn-photo-camera').onclick=()=>{$('np-photo-camera').click();};
document.getElementById('btn-photo-gallery').onclick=()=>{$('np-photo-gallery').click();};
$('np-photo-camera').onchange=()=>{ handlePhotoChange($('np-photo-camera')); };
$('np-photo-gallery').onchange=()=>{ handlePhotoChange($('np-photo-gallery')); };

window.updateListItemFromProduce = function(id, payload){
  const qty  = (payload?.produced_last_qty ?? payload?.qty ?? 0);
  const date = (payload?.produced_at || new Date().toISOString().slice(0,10));

  const elQty  = document.querySelector(`#plq-${CSS.escape(String(id))}`);
  const elDate = document.querySelector(`#pdat-${CSS.escape(String(id))}`);

  if (elQty)  elQty.textContent  = qty;
  if (elDate) elDate.textContent = date;
};

window.addEventListener('DOMContentLoaded', () => {
  const npMat = document.getElementById('np-material');
  if (npMat) {
    npMat.innerHTML = materialOptionsHtml("");  // 新增時沒有預設值
  }
  // 其他初始化...
});


function updatePhotoPreview(){
  const wrap = $('np-photo-preview');
  const nameEl = $('np-photo-name');
  if(!wrap) return;

  if(!selectedPhotos.length){
    wrap.innerHTML = '<span class="muted">尚未選擇照片</span>';
    if (nameEl) nameEl.textContent = '';
    return;
  }

  wrap.innerHTML = '';
  selectedPhotos.forEach((file, idx)=>{
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.className = 'photo-thumb-wrap';
    div.innerHTML = `
      <img src="${url}" class="photo-thumb">
      <button type="button" data-idx="${idx}">×</button>
    `;
    wrap.appendChild(div);
  });
  if (nameEl) nameEl.textContent = `已選擇 ${selectedPhotos.length} 張`;

  wrap.querySelectorAll('button[data-idx]').forEach(btn=>{
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-idx'), 10);
      if (!isNaN(i)) {
        selectedPhotos.splice(i, 1);
        updatePhotoPreview();
      }
    };
  });
}

function handlePhotoChange(input){
  if(!(input.files && input.files.length)) return;
  const files = Array.from(input.files);

  if (input.id === 'np-photo-camera') {
    // 拍照通常只有一張，就加第一張
    selectedPhotos.push(files[0]);
    $('np-photo-gallery').value = '';
  } else {
    // 相簿可以一次選多張
    selectedPhotos = selectedPhotos.concat(files);
    $('np-photo-camera').value = '';
  }

  updatePhotoPreview();
}

function updateListItemFromProduce(id, payload){
  const qty  = (payload?.produced_last_qty ?? payload?.qty ?? 0);
  const date = (payload?.produced_at || new Date().toISOString().slice(0,10));

  // 用 CSS.escape 保險（雖然你的 id 是數字，但這樣更穩）
  const elQty  = document.querySelector(`#plq-${CSS.escape(String(id))}`);
  const elDate = document.querySelector(`#pdat-${CSS.escape(String(id))}`);

  if (elQty)  elQty.textContent  = qty;
  if (elDate) elDate.textContent = date;
}

//材質列表
const MATERIAL_OPTIONS = [
  "",       // 代表「未選擇」
  "ABS",
  "PP",
  "PVC",
  "HDPE",
  "LDPE",
  "PA6",
  "PA6 GF10%",
  "PA6 GF15%",
  "PA6 GF20%",
  "PA6 GF30%",
  "PA66",
  "POM",
  "PC",
  "PBT",
  "TPR",
  "TPU",
  "TPE",
  "其他",
];

function materialOptionsHtml(selectedValue) {
  const safeSelected = selectedValue || "";
  return MATERIAL_OPTIONS.map(val => {
    if (val === "") {
      return `<option value="">（請選擇材質）</option>`;
    }
    const sel = (val === safeSelected) ? ' selected' : '';
    return `<option value="${val}"${sel}>${val}</option>`;
  }).join('');
}


/* ===== 廠商地區解析 + 排序工具（請放在 <script> 最上面） ===== */

let vendorListLoadVersion = 0; // 防止舊請求覆蓋新結果

// 統一「臺」→「台」
function normalizeCity(s){ return (s || "").replace(/臺/g, "台"); }

// 地址 → 城市 → 區域
const REGION_MAP_TW = {
  北部: ["台北市","新北市","基隆市","桃園市","新竹市","新竹縣","宜蘭縣"],
  中部: ["苗栗縣","台中市","彰化縣","彰化市","南投縣","雲林縣"],
  南部: ["嘉義市","嘉義縣","台南市","高雄市","屏東縣"],
  東部: ["花蓮縣","台東縣"],
  離島: ["澎湖縣","金門縣","連江縣"]
};

function findCityTW(addr=""){
  addr = (addr || "").replace(/\s+/g,"");
  for(const [region, cities] of Object.entries(REGION_MAP_TW)){
    for(const c of cities){
      if(addr.includes(c)) return { city: c, region };
    }
  }
  return { city: "", region: "其他" };
}
function findCityTW(addr = "") {
  // 去空白 + 把「臺」統一成「台」
  let naddr = (addr || "").replace(/\s+/g, "").replace(/臺/g, "台");

  for (const [region, cities] of Object.entries(REGION_MAP_TW)) {
    for (const c of cities) {
      const cNorm = c.replace(/臺/g, "台");
      if (naddr.includes(cNorm)) {
        return { city: cNorm, region };
      }
    }
  }
  return { city: "", region: "其他" };
}

// 區域內自訂城市順序（可自行調整）
const CITY_ORDER_TW = {
  北部: ["台北市","新北市","基隆市","桃園市","新竹市","新竹縣","宜蘭縣"],
  中部: ["台中市","彰化縣","彰化市","南投縣","雲林縣","苗栗縣"], // ← 依你需求調整
  南部: ["嘉義市","嘉義縣","台南市","高雄市","屏東縣"],  // ← 高雄在台南之後
  東部: ["花蓮縣","台東縣"],
  離島: ["澎湖縣","金門縣","連江縣"]
};
function cityOrderRank(region, city){
  const arr = CITY_ORDER_TW[region] || [];
  const idx = arr.indexOf(normalizeCity(city));
  return idx === -1 ? 999 : idx;
}

function regionRankTW(r){
  return {北部:0,中部:1,南部:2,東部:3,離島:4}[r] ?? 5;
}

// 依「區域→城市自訂順序→名稱」排序
function sortVendorsTW(items){
  const withRegion = items.map(v=>{
    const {city, region} = findCityTW(v.address || "");
    return {...v, _city: city, _region: region, _rank: regionRankTW(region)};
  });

  // 方便你在 console 驗證
  console.log("📍 Vendor region parse result:",
    withRegion.map(v=>({name:v.name, addr:v.address, city:v._city, region:v._region, rank:v._rank}))
  );

  withRegion.sort((a,b)=>{
    if(a._rank !== b._rank) return a._rank - b._rank;                          // 區域順序
    const ar = cityOrderRank(a._region, a._city), br = cityOrderRank(b._region, b._city);
    if(ar !== br) return ar - br;                                              // 區域內城市順序
    return (a.name||"").localeCompare(b.name||"", "zh-Hant");                   // 同城市再比名稱
  });

  return withRegion;
}

// 將排序結果寫入指定 <select>
function applyVendorOptions(selectId, itemsSorted){
  const sel = document.getElementById(selectId);
  if(!sel) return;
  const frag = document.createDocumentFragment();
  const first = document.createElement('option');
  first.value = "";
  first.textContent = "（未選擇）";
  frag.appendChild(first);
  for(const v of itemsSorted){
    const opt = document.createElement('option');
    opt.value = String(v.id);
    opt.textContent = v._city ? `${v.name}（${v._city}）` : v.name;
    frag.appendChild(opt);
  }
  sel.innerHTML = "";
  sel.appendChild(frag);
  sel.value = ""; // 預設空白
}

// 載入廠商→排序→寫入下拉；版本號避免舊請求覆蓋
async function preloadVendors(selectId='np-vendor'){
  if(!token) return;
  const myVersion = ++vendorListLoadVersion;
  const res = await fetch(API+'/vendors', {headers:{'Authorization':'Bearer '+token}});
  let items = await res.json();
  items = sortVendorsTW(items);
  if(myVersion !== vendorListLoadVersion) return; // 忽略過期結果
  applyVendorOptions(selectId, items);
}


document.addEventListener('click', (e)=>{
  if(e.target && e.target.id==='btn-back-products'){
    document.getElementById('view-product-detail').classList.add('hide');
    switchTab('products');
  }
  if(e.target && e.target.id==='btn-back-vendors'){
    document.getElementById('view-vendor-detail').classList.add('hide');
    switchTab('vendors');
  }
  const otherEl = document.getElementById('np-other');
  if (otherEl && !otherEl.value) {
    otherEl.value = OTHER_TEMPLATE;
  }
}, {passive:true});

async function loginIfNeeded(){
  if(token) return;
  const fd=new URLSearchParams(); fd.append('username','admin'); fd.append('password','admin123');
  const r=await fetch(API+'/auth/login',{method:'POST', body: fd});
  if(r.ok){
    token=(await r.json()).access_token;
    document.getElementById('status').textContent='已登入';
  }else{
    document.getElementById('status').textContent='未登入';
  }
  try{
    const v=await fetch(API+'/__version'); if(v.ok){ const j=await v.json(); if(j.build) document.getElementById('ver').textContent=j.build; }
  }catch(_){}
}

function maskPrice(value){
  if(value===null || value===undefined || value==='') return '-';
  return `<span class="price-mask" onclick="this.classList.add('revealed'); this.textContent='${String(value)}'">████</span>`;
}

async function searchProducts(page){
  await loginIfNeeded();
  if (!token) { alert('請先登入'); return; }

  // 如果有帶 page 參數，就更新目前頁碼
  if (typeof page === 'number' && page >= 1) {
    productPage = page;
  }
  if (!productPage || productPage < 1) productPage = 1;

  const url = new URL(API + '/products');

  // 搜尋關鍵字（廠商 + 產品名稱，由後端處理）
  const qEl = document.getElementById('q');
  const q = qEl ? qEl.value.trim() : '';
  if (q) url.searchParams.set('q', q);

  // 分頁參數
  url.searchParams.set('page', String(productPage));
  url.searchParams.set('size', String(PRODUCT_PAGE_SIZE));

  // 防止快取
  url.searchParams.set('_', Date.now().toString());

  const mySeq = ++_productsReqSeq;
  const res = await fetch(url, {
    headers: { 'Authorization': 'Bearer ' + token },
    cache: 'no-store'
  });
  if (mySeq !== _productsReqSeq) return;

  const listEl = document.getElementById('product-list');

  if (!res.ok){
    listEl.innerHTML = `<div class="muted">讀取失敗（${res.status}）</div>`;
    return;
  }

  const data = await res.json();

  // 兼容：如果還是舊版（直接傳陣列）就當全部資料
  const items = Array.isArray(data) ? data : (data.items || []);

  productTotalItems = (typeof data.total === 'number') ? data.total : items.length;
  const size = (typeof data.size === 'number') ? data.size : PRODUCT_PAGE_SIZE;
  productPage = (typeof data.page === 'number') ? data.page : productPage;
  productTotalPages = Math.max(1, Math.ceil(productTotalItems / size));

  // 產品卡片
  const cardsHtml = items.map(p => `
    <div class="card clickable" onclick="openProduct(${p.id})" role="button" tabindex="0">
      <div><b>${p.name || '-'}</b></div>
      <div class="muted">${p.material || ''} ${p.color || ''}</div>
      <div class="muted">最後生產數量：<span id="plq-${p.id}">${p.produced_last_qty ?? 0}</span></div>
      <div class="muted">最後生產日期：<span id="pdat-${p.id}">${p.produced_at || '-'}</span></div>
    </div>
  `).join('');

  // 分頁列
const pagerHtml = productTotalItems ? `
  <div class="card" style="margin-top:12px; padding:12px; display:flex; flex-direction:column; gap:10px; align-items:center;">

    <!-- 頁碼摘要 -->
    <div class="muted" style="text-align:center;font-size:15px;">第 ${productPage} / ${productTotalPages} 頁（共 ${productTotalItems} 筆）</div>

    <!-- 動態頁碼列 -->
    <div id="product-pagination" class="pagination-bar"></div>

  </div>
` : `<div class="muted">沒有符合條件的產品</div>`;




  listEl.innerHTML = cardsHtml + pagerHtml;

  // 動態產生頁碼按鈕
const pagEl = document.getElementById('product-pagination');

if (pagEl) {
  let html = "";

  // << 上一頁
  html += `<button class="pg-btn" data-page="${productPage - 1}"${productPage <= 1 ? 'disabled' : ''}>&laquo;</button>`;

  const maxPageButtons = 5;   // 中間最多顯示 5 個頁碼

  let start = Math.max(1, productPage - 2);
  let end   = Math.min(productTotalPages, start + maxPageButtons - 1);

  // 若結尾不夠 5 格，向左補
  start = Math.max(1, end - maxPageButtons + 1);

  // 頭部省略號
  if (start > 1) {
    html += `<button class="pg-btn" data-page="1">1</button>`;
    html += `<span class="muted">...</span>`;
  }

  // 中間主頁碼
  for (let p = start; p <= end; p++) {
    if (p === productPage) {
      html += `<button class="pg-btn active" data-page="${p}"disabled style="font-weight:bold;">${p}</button>`;
    } else {
      html += `<button class="pg-btn" data-page="${p}">${p}</button>`;
    }
  }

  // 尾部省略號
  if (end < productTotalPages) {
    html += `<span class="muted">...</span>`;
    html += `<button class="pg-btn" data-page="${productTotalPages}">${productTotalPages}</button>`;}

  // >> 下一頁
  html += `<button class="pg-btn" data-page="${productPage + 1}"${productPage >= productTotalPages ? 'disabled' : ''}>&raquo;</button>`;

  pagEl.innerHTML = html;

  // 綁定事件
  pagEl.querySelectorAll(".pg-btn").forEach(btn => {
    btn.onclick = () => {
      const p = parseInt(btn.dataset.page);
      if (!isNaN(p) && p >= 1 && p <= productTotalPages) {
        searchProducts(p);
      }
    };
  });
}


  // 綁定分頁按鈕（綁在 render 後）
  const btnFirst = document.getElementById('product-page-first');
  const btnPrev  = document.getElementById('product-page-prev');
  const btnNext  = document.getElementById('product-page-next');
  const btnLast  = document.getElementById('product-page-last');

  if (btnFirst) btnFirst.onclick = () => searchProducts(1);
  if (btnPrev)  btnPrev.onclick  = () => {
    if (productPage > 1) searchProducts(productPage - 1);
  };
  if (btnNext)  btnNext.onclick  = () => {
    if (productPage < productTotalPages) searchProducts(productPage + 1);
  };
  if (btnLast)  btnLast.onclick  = () => searchProducts(productTotalPages);
}

// 物件→訊息
function toMsg(d){
  if (Array.isArray(d)) return d.map(x => ((x.loc||[]).join('.')+': '+(x.msg||x.detail||'錯誤'))).join('；');
  if (d && typeof d === 'object') return d.detail || JSON.stringify(d);
  return String(d ?? '');
}

// 安全 append：元件存在才 append；檔案 input 只在有檔案才 append
function appendIf(fd, id, field){
  const el = $(id);
  if (!el) return;
  if (el.type === 'file') { if (el.files && el.files[0]) fd.append(field, el.files[0]); }
  else { if (el.value !== '') fd.append(field, el.value); }
}

// 安全清空：元件存在才清
function clearIf(id){
  const el = $(id);
  if (!el) return;
  if (el.type === 'file') el.value = '';
  else if (el.tagName === 'SELECT') el.value = '';
  else el.value = '';
}

  fd.append('sku', $('np-sku').value);

  let otherVal = $('np-other').value;
  if (otherVal) {
    const t1 = otherVal.replace(/\r\n/g, '\n').trim();
    const t2 = OTHER_TEMPLATE.replace(/\r\n/g, '\n').trim();

      otherVal = '';
    }

    else if (gal) files.push(gal);
  }
  for (const f of files){
    fd.append('photo', f);   // **注意：用同一個 key 'photo' 多次**
  }

  const res = await fetch(API+'/products', {
    method: 'POST',
    headers: { 'Authorization':'Bearer '+token },
    body: fd
  });

  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch { data = {detail:text}; }

  const toMsg = (d)=>{
    if(Array.isArray(d))
      return d.map(x=> (x.loc||[]).join('.')+': '+(x.msg||x.detail||'錯誤')).join('；');
    if(typeof d==='object') return d.detail||JSON.stringify(d);
    return String(d);
  };

  if(!res.ok){
    $('np-status').textContent = '新增失敗：' + toMsg(data.detail ?? data);
    return;
  }

  $('np-status').textContent = '新增成功！條碼：' + (data.mold_barcode || '-');

  // 清空欄位
  $('np-name').value = '';
  $('np-vendor').value = '';
  $('np-material').value = '';
  $('np-sku').value = '';
  $('np-color').value = '';
  $('np-dye').value = '';
  $('np-packaging').value = '';

  $('np-photo-camera').value = '';
  $('np-photo-gallery').value = '';
  $('np-photo-name').textContent = '';

    ['nv-name','nv-addr','nv-phone','nv-contact','nv-fax','nv-email','nv-other']
      .forEach(id => { const el=$(id); if(el) el.value=''; });

    // 重新載入：下拉選單與列表（如果你有 sortVendorsTW 會沿用）
    try { await preloadVendors(); } catch(e){}
    try { await loadVendors(); } catch(e){}

  }catch(err){
    setTextIf('nv-status','新增失敗（網路/程式）：' + (err?.message || '') + (body? '｜'+body : ''));
  }
}

async function importVendorsExcel(){
  await loginIfNeeded();
  const f=document.getElementById('ve-file').files[0]; if(!f){ alert('請先選擇檔案'); return; }
  const fd=new FormData(); fd.append('file', f);
  const res=await fetch(API+'/vendors/import_excel',{method:'POST', headers:{'Authorization':'Bearer '+token}, body: fd});
  const data=await res.json();
  document.getElementById('ve-status').textContent = res.ok ? (data.detail||'匯入完成') : ('匯入失敗：'+(data.detail||res.status));
  if(res.ok){ preloadVendors(); }
}

switchTab('products');
loginIfNeeded().then(()=>{ preloadVendors(); });
</script>
